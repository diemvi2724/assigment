<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Node.js Button Demo</title>
</head>
<body>
    <h1>Demo Nút Ấn</h1>
    <button onclick="showHello()">Nhấn vào Xin chào</button>
    <button onclick="showGoodbye()">Nhấn vào Tạm biệt</button>
    <script>
        function showHello() {
            alert("Xin chào");
        }
        function showGoodbye() {
            alert("Tạm biệt");
        }
    </script>
</body>
</html>
