name: Compile and Build Java Backend

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'app/**'
      - 'pom.xml'
      - '.github/workflows/compile-backend.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'app/**'
      - 'pom.xml'

jobs:
  build:
    name: Build & Verify Java Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile & Package with Maven
        run: mvn clean compile package -DskipTests --batch-mode

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: app/target/*.jar
          retention-days: 7
